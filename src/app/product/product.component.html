<section class="product-catalog">
  <div class="catalog-heading">
    <span class="eyebrow">Featured tech</span>
    <h2>Build your setup</h2>
    <p>Practical essentials, ready to add to your cart.</p>
  </div>

  <div class="product-grid">
    <article class="product-card" *ngFor="let product of products">
      <div class="product-image" [class.laptop]="product.id === 1" [class.mouse]="product.id === 2">
        <img [src]="product.imageUrl" [alt]="product.name" />
      </div>

      <div class="product-info">
        <span class="product-category">{{ product.id === 1 ? 'Computing' : 'Accessories' }}</span>
        <h3>{{ product.name }}</h3>
        <p>{{ product.description }}</p>
        <div class="price-row">
          <span class="price">${{ product.price.toFixed(2) }}</span>
          <button type="button" (click)="addToCart(product)">Add to cart</button>
        </div>
      </div>
    </article>
  </div>
</section>
